<!-- Dezon Pro – Dự toán chuyên nghiệp (bóc tách & báo giá) -->
<style>
  /* ===== 3 THEME ĐƠN SẮC: mỗi theme chỉ 1 tông màu (điểm nhấn + header + bảng cùng màu) ===== */
  /* THEME VÀNG (mặc định) */
  :root{
    --brand:#b3925e; --brand-600:#8a6d3f; --brand-050:#f7f2ea; --brand-100:#ece0cd;
    --hero1:#6f5730; --hero2:#8f6f42; --hero3:#b3925e;
    --navy:#8a6d3f; --navy-d:#6f5730; --band:#efe6d5; --band-tx:#6f5730; --band-bd:#e0d3b8;
    --bg:#f6f7f9; --card:#ffffff; --line:#edeff3; --line2:#e4e7ee;
    --ink:#1b2130; --ink2:#3a4256; --muted:#8b93a7; --soft:#fafbfc;
    --green:#16a34a; --green050:#e9f8ef; --amber:#e08a1e; --amber050:#fdf3e3;
    --danger:#ef4444; --blue:#b3925e;
  }
  /* THEME XANH */
  :root[data-theme="xanh"]{
    --brand:#2f5fbf; --brand-600:#264f9e; --brand-050:#eef3fc; --brand-100:#d5e2f7;
    --hero1:#12314f; --hero2:#1f3864; --hero3:#2e5c96;
    --navy:#1f3864; --navy-d:#12314f; --band:#dbe6f4; --band-tx:#1f3864; --band-bd:#b9cbe4;
    --blue:#2f5fbf;
  }
  /* THEME ĐEN */
  :root[data-theme="den"]{
    --brand:#111827; --brand-600:#000000; --brand-050:#f1f2f4; --brand-100:#e2e4e9;
    --hero1:#000000; --hero2:#1a1a1a; --hero3:#333333;
    --navy:#111827; --navy-d:#000000; --band:#e9eaee; --band-tx:#111827; --band-bd:#cfd2da;
    --blue:#111827;
  }
  *{box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui,Arial,sans-serif}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:13.5px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .app{display:flex;min-height:100vh}
  a{color:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d8dce4;border-radius:8px;border:2px solid transparent;background-clip:content-box}

  /* ===== LOADING ===== */
  .loader{position:fixed;inset:0;background:#0f1b26;display:flex;align-items:center;justify-content:center;z-index:200;transition:opacity .35s}
  .loader.hide{opacity:0;pointer-events:none}
  .loader-box{text-align:center;color:#fff;width:300px;max-width:82vw}
  .loader-logo{width:64px;height:64px;border-radius:16px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;letter-spacing:.5px;margin:0 auto 16px;box-shadow:0 12px 34px rgba(0,0,0,.55)}
  .loader-title{font-size:20px;font-weight:800;letter-spacing:.5px}
  .loader-sub{color:#9fb0c0;font-size:13px;margin:6px 0 20px}
  .loader-bar{height:8px;background:#1e2f3f;border-radius:6px;overflow:hidden}
  .loader-bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--hero1),var(--hero2));transition:width .25s ease}
  .loader-pct{margin-top:10px;font-weight:700;font-size:14px;color:#cdb488}

  /* ===== TOP NAV (điều hướng trên cùng) ===== */
  .app{display:block}
  .topnav{background:var(--card);border-bottom:1px solid var(--line);padding:9px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .brand .logo{width:36px;height:36px;border-radius:10px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;letter-spacing:.3px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .brand b{color:var(--ink);font-size:15px;display:block;line-height:1.1}
  .brand small{color:var(--muted);font-size:10.5px}
  .nav{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
  .nav button{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--ink2);padding:8px 13px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap}
  .nav button .ic{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:#7b8497}
  .nav button .ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nav button:hover{background:#f4f5f8}
  .nav button.on{background:var(--brand-050);color:var(--brand-600);font-weight:700}
  .nav button.on .ic{color:var(--brand-600)}
  /* nút đổi theme */
  .themesw{display:inline-flex;gap:4px;background:var(--soft);border:1px solid var(--line2);border-radius:20px;padding:3px}
  .themesw button{border:0;background:none;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--muted);padding:5px 11px;border-radius:16px;display:inline-flex;align-items:center;gap:5px}
  .themesw button.on{background:var(--navy);color:#fff}
  .prog{height:6px;background:#e9ebf1;border-radius:4px;margin-top:6px;overflow:hidden}
  .prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--hero1),var(--hero2))}

  /* ===== CONTENT ===== */
  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{background:var(--soft);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:54px;z-index:29}
  .crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:600}
  .badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--amber050);color:var(--amber);text-transform:uppercase;letter-spacing:.3px}
  .badge.done{background:var(--green050);color:var(--green)}
  .spacer{flex:1}
  .pjsel{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .page{padding:20px 22px}

  /* ===== HERO ===== */
  .hero{margin:20px 22px 0;border-radius:20px;padding:26px 30px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(115deg,var(--navy-d) 0%,var(--navy) 60%,var(--navy) 100%)}
  .hero .eyebrow{font-size:11px;letter-spacing:1.4px;font-weight:700;opacity:.9;text-transform:uppercase;position:relative}
  .hero h1{margin:7px 0 13px;font-size:29px;font-weight:800;letter-spacing:-.5px;position:relative}
  .hpills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;position:relative}
  .hpill{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.28);color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
  .hmeta{display:flex;gap:22px;flex-wrap:wrap;font-size:12.5px;opacity:.92;position:relative}
  .hmeta span b{font-weight:700}
  .hprog-wrap{margin-top:16px;position:relative;max-width:640px}
  .hprog-top{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;opacity:.95;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
  .hprog{height:7px;background:rgba(255,255,255,.28);border-radius:6px;overflow:hidden}
  .hprog>i{display:block;height:100%;background:#fff;border-radius:6px}

  /* form controls */
  select,input,textarea{background:#fff;border:1px solid var(--line2);color:var(--ink);border-radius:9px;padding:9px 11px;font-size:13px;outline:none;font-family:inherit}
  select:focus,input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(179,146,94,.14)}
  .btn{background:var(--brand);border:0;color:#fff;padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 6px rgba(179,146,94,.28)}
  .btn:hover{filter:brightness(1.05)}
  .btn.green{background:var(--green);box-shadow:0 2px 6px rgba(22,163,74,.25)}
  .btn.ghost{background:#fff;border:1px solid var(--line2);color:var(--ink2);box-shadow:none}
  .btn.red{background:var(--danger);box-shadow:0 2px 6px rgba(239,68,68,.25)}
  .btn.sm{padding:6px 12px;font-size:12px;border-radius:9px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.04)}
  .card h3{margin:0 0 15px;font-size:15.5px;font-weight:700}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}

  /* stat cards */
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
  @media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(16,24,40,.04)}
  .stat .lbl{color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .stat .val{font-size:27px;font-weight:800;margin:7px 0 2px;letter-spacing:-.5px}
  .stat .sub{color:var(--muted);font-size:11.5px}
  .stat.blue .val{color:var(--brand-600)} .stat.green .val{color:var(--green)}
  .stat.amber .val{color:var(--amber)} .stat.navy .val{color:var(--ink)}

  /* tables */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
  th,td{border-bottom:1px solid var(--line);padding:11px 14px;text-align:left;vertical-align:middle}
  th{background:var(--soft);font-weight:600;color:#6b7385;white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  tbody tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;white-space:nowrap}
  tbody tr:hover{background:#faf7f2}
  td input,td select{padding:6px 8px;border-radius:7px}
  td input.qty{width:74px;text-align:right}
  td input.price{width:110px;text-align:right}
  td input.pct{width:64px;text-align:right}
  td input.txt{width:100%;min-width:120px}
  .thumb{width:44px;height:44px;object-fit:cover;border-radius:9px;background:#f1f2f6;border:1px solid var(--line)}
  .thumb.imgx{background:repeating-linear-gradient(45deg,#f1f2f6,#f1f2f6 5px,#e6e8ee 5px,#e6e8ee 10px)}
  .noimg{color:#c2c8d2;font-size:13px}
  .row-del{color:var(--danger);cursor:pointer;font-weight:700;font-size:15px}

  /* ===== Chọn sản phẩm có ảnh + giá (thay <select> tên SP) ===== */
  /* nút mở popup chọn SP: trông y như ô select xung quanh (viền ẩn, hiện khi hover) */
  .pp-btn{display:flex;align-items:flex-start;gap:6px;width:100%;min-width:110px;background:transparent;border:1px solid transparent;border-radius:7px;padding:6px 8px;cursor:pointer;text-align:left;font-size:13px;color:var(--ink);font-family:inherit}
  .pp-btn:hover,.pp-btn:focus{border-color:var(--line2);background:#fff}
  .pp-btn .nm{flex:1;min-width:0;white-space:normal;word-break:break-word;line-height:1.35}   /* tên đầy đủ, xuống dòng, không cắt "..." */
  .pp-btn .car{margin-top:2px}
  .pp-btn .nm.ph{color:var(--muted)}
  .pp-btn .car{color:var(--muted);font-size:10px;flex-shrink:0}
  .pp-pop{position:fixed;z-index:120;width:430px;max-width:94vw;background:#fff;border:1px solid var(--line2);border-radius:14px;box-shadow:0 18px 44px rgba(16,24,40,.18);overflow:hidden}
  .pp-pop .hd{padding:9px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .pp-pop .hd input{flex:1;padding:7px 10px;font-size:13px}
  .pp-scope{font-size:11px;color:var(--muted);padding:6px 11px;border-bottom:1px solid var(--line);background:var(--soft);display:flex;gap:8px;align-items:center}
  .pp-scope button{background:none;border:0;color:var(--brand-600);font-weight:700;cursor:pointer;font-size:11px;font-family:inherit;padding:0}
  .pp-list{max-height:330px;overflow:auto}
  .pp-item{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
  .pp-item:last-child{border-bottom:0}
  .pp-item:hover,.pp-item.on{background:var(--brand-050)}
  .pp-item.cur{box-shadow:inset 3px 0 0 var(--brand)}
  .pp-item .th{width:40px;height:40px;flex-shrink:0;object-fit:cover;border-radius:8px;background:#f1f2f6;border:1px solid var(--line)}
  .pp-item .th.imgx{background:repeating-linear-gradient(45deg,#f1f2f6,#f1f2f6 5px,#e6e8ee 5px,#e6e8ee 10px)}
  .pp-item .inf{flex:1;min-width:0}
  .pp-item .t{font-size:12.5px;line-height:1.3;font-weight:600;word-break:break-word}   /* tên đầy đủ, tự xuống dòng, không cắt */
  .pp-item.cur .t{font-weight:800}
  .pp-item .s{font-size:10.5px;color:var(--muted);word-break:break-word;margin-top:1px}
  .pp-item .pr{text-align:right;flex-shrink:0}
  .pp-item .pr b{font-size:12.5px;color:var(--brand-600);white-space:nowrap}
  .pp-item .pr span{display:block;font-size:10px;color:var(--muted)}
  .pp-ft{padding:7px 10px;border-top:1px solid var(--line);background:var(--soft);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
  .pp-ft button{background:none;border:0;color:var(--brand-600);font-weight:700;cursor:pointer;font-size:12px;font-family:inherit;padding:0}
  .pill{background:#f1f2f6;border:1px solid var(--line);border-radius:20px;padding:3px 11px;font-size:11px;color:#5a6274;display:inline-block;font-weight:500}
  .tag{background:var(--brand-050);color:var(--brand-600);border-radius:7px;padding:3px 9px;font-size:11px;font-weight:600}
  .empty{color:var(--muted);padding:36px;text-align:center}
  .loading{color:var(--muted);padding:16px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .field input,.field textarea,.field select{width:100%}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* chips (bật/tắt cột) */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#f1f2f6;border:1px solid var(--line2);color:#5a6274;padding:7px 13px;border-radius:20px;cursor:pointer;font-size:12px;user-select:none;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 2px 6px rgba(179,146,94,.28)}

  /* dashboard bars */
  .bar-row{display:grid;grid-template-columns:160px 1fr 120px;gap:12px;align-items:center;padding:8px 0}
  .bar-row .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar{height:24px;background:#f1f2f6;border-radius:8px;overflow:hidden;position:relative}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--hero1),var(--hero2));border-radius:8px}

  /* search box */
  .searchbox{position:relative;flex:1;max-width:360px}
  .searchbox input{width:100%;padding-left:34px}
  .searchbox .mag{position:absolute;left:11px;top:9px;color:var(--muted)}
  .quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .quick .q{background:#fff;border:1px solid var(--line2);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--brand-600)}
  .quick .q:hover{background:var(--brand-050)}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(27,33,48,.42);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:60}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:18px;padding:24px;width:470px;max-width:94vw;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(16,24,40,.24)}
  .modal h3{margin:0 0 16px}
  .modal-act{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:80;box-shadow:0 12px 32px rgba(0,0,0,.28);font-weight:500}
  /* dòng nhóm Tầng trong bảng Báo giá — giống dải phân đoạn ở Bóc tách */
  .tbl-wrap tr.qgrp td{background:var(--band);color:var(--navy);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.3px;padding:9px 12px;border-top:1px solid var(--band-bd)}
  .totbar{display:flex;gap:26px;flex-wrap:wrap;align-items:center;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .totbar .t{text-align:right}
  .totbar .t .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .totbar .t .v{font-size:18px;font-weight:800}
  .totbar .grand .v{font-size:23px;color:var(--green)}

  /* ===== TỜ BÌA ===== */
  .cover2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.cover2{grid-template-columns:1fr}}
  .cvr{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12.5px;background:#fff}
  .cvr .h{background:var(--navy-d);color:#fff;text-align:center;padding:14px 10px;font-weight:800;font-size:17px;line-height:1.4;letter-spacing:.3px}
  .cvr .h small{display:block;font-weight:400;font-size:11.5px;color:#c7d3e6;margin-top:3px}
  .cvr .h small b{color:#fff}
  .cvr .info{display:grid;grid-template-columns:170px 1fr 120px 1fr;gap:0;padding:0;background:#f2f3f5;font-size:12px}
  .cvr .info>div{padding:9px 12px;border-bottom:1px solid #e4e7ec}
  .cvr .info .lb{font-weight:700;color:#33415c}
  .cvr .info .vl{background:#fff}
  .cvr table{width:100%;border-collapse:collapse}
  .cvr td .nm,.cvr td.sc{word-break:break-word}
  .cvr thead th{background:var(--navy-d);color:#fff;font-size:11px;padding:9px 8px;text-transform:uppercase;letter-spacing:.3px;border-right:1px solid #2b466a}
  .cvr tbody td{border:1px solid #d8dee7;padding:7px 9px;vertical-align:top}
  .cvr tbody td.no{text-align:center;font-weight:700;width:46px}
  .cvr tbody td.money{text-align:right;white-space:nowrap;width:140px}
  .cvr tbody td.pct{text-align:right;white-space:nowrap;width:74px}
  .cvr tbody tr.sec td{background:#c9ccd1;font-weight:800}
  .cvr tbody td .nm{font-weight:700;line-height:1.35}
  .cvr tbody td.sc{font-weight:800;text-transform:uppercase}
  .cvr tbody td .ds{font-style:italic;color:#667085;font-size:11.5px;line-height:1.35;margin-top:2px}
  .cvr tfoot td{background:var(--navy-d);color:#fff;font-weight:800;padding:10px 9px;font-size:13px}
  /* ô sửa trực tiếp trên tờ bìa */
  .cvr [contenteditable]{outline:none;border-radius:4px;min-height:1.2em;cursor:text}
  .cvr [contenteditable]:hover{background:rgba(179,146,94,.12)}
  .cvr [contenteditable]:focus{background:#fff;box-shadow:0 0 0 2px var(--brand)}
  .cvr .ds:empty::before{content:attr(data-ph);color:#aab;font-style:italic}
  .cvr .info .vl[contenteditable]:hover{background:#fbf7f0}
  .cvr tbody tr.sec [contenteditable]:hover{background:rgba(255,255,255,.5)}
  .cvr tbody tr{position:relative}
  .cvr .rowdel{position:absolute;left:-24px;top:50%;transform:translateY(-50%);color:var(--danger);cursor:pointer;font-size:13px;opacity:0;transition:opacity .12s}
  .cvr tbody td.no:hover .rowdel,.cvr .rowdel:hover{opacity:1}
  /* toggle chọn mẫu */
  .maubtn{background:#f1f2f6;border:1px solid var(--line2);color:#5a6274;padding:7px 15px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:700}
  .maubtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
  /* editor dòng hạng mục */
  .cvr-ed{display:flex;flex-direction:column;gap:7px}
  .cvr-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .cvr-row.lv1{background:#f4efe6;border-color:#e7dcc7}
  .cvr-row.lv2{background:#faf8f3}
  .cvr-no{width:52px;flex-shrink:0}
  .cvr-no input{width:100%;text-align:center;padding:6px 4px;font-weight:700;color:var(--brand-600)}
  .cvr-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .cvr-mid input{width:100%}
  .cvr-mid input.nm{font-size:13px;font-weight:600}

<script>
/*** ================= STATE + API ================= ***/
var S = { projects:[], products:[], cur:null, lines:[], cols:{}, linesByDA:{}, fNhom:'', fHM:'', fMin:'', fMax:'', cover:[], bTab:'', bcOrder:[], bcOn:{}, bcW:{}, bcFilter:{} };

function api(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return fetch('/api/'+encodeURIComponent(fn), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({args:args})
  }).then(function(r){
    return r.json().catch(function(){ return {error:'Phản hồi không hợp lệ (HTTP '+r.status+')'}; });
  }).then(function(d){
    if(d && d.error) throw new Error(d.error);
    return d ? d.result : null;
  });
}
// ==== Cache lines theo dự án: đọc sheet 1 lần, dùng lại nhiều tab ====
function setLines(maDA, lines){ S.linesByDA[maDA]=lines||[]; if(S.cur&&S.cur.maDA===maDA) S.lines=S.linesByDA[maDA]; }
async function getLinesCached(maDA){
  if(S.linesByDA[maDA]) return S.linesByDA[maDA];
  var l = await api('getLines', maDA) || [];
  setLines(maDA, l); return l;
}
// ==== Tính toán tại trình duyệt (không gọi server) ====
function computeDashboard(lines){
  var von=0,ban=0,kl=0,groups={};
  lines.forEach(function(l){
    von+=l.thanhTienVon; ban+=l.thanhTienBan; kl+=l.soLuong;
    var k=l.nhom||'Khác';
    if(!groups[k]) groups[k]={nhom:k,von:0,ban:0,count:0};
    groups[k].von+=l.thanhTienVon; groups[k].ban+=l.thanhTienBan; groups[k].count++;
  });
  var byGroup=Object.keys(groups).map(function(k){return groups[k];}).sort(function(a,b){return b.ban-a.ban;});
  var ln=ban-von;
  return { tongHangMuc:lines.length, tongKhoiLuong:kl, giaTriVon:von, tongGiaBan:ban,
    loiNhuan:ln, bienLN:ban>0?ln/ban*100:0, byGroup:byGroup };
}
function computeQuote(lines, project){
  var sub=0; lines.forEach(function(l){sub+=l.thanhTienBan;});
  var vatPct=project?(Number(project.vat)||0):0;
  var vat=Math.round(sub*vatPct/100);
  return { project:project, lines:lines, subtotal:sub, vatPct:vatPct, vat:vat, total:sub+vat };
}
function fmt(n){ return (Math.round(Number(n)||0)).toLocaleString('vi-VN'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(function(){t.style.display='none';},2500); }
function driveThumb(link){ if(!link) return ''; var m=String(link).match(/[-\w]{25,}/); return m?'https://drive.google.com/thumbnail?id='+m[0]+'&sz=w120':''; }
function imgSrc(v){ if(!v) return ''; v=String(v); if(/^https?:\/\//.test(v)) return v; return driveThumb(v); }
// vẽ ảnh kèm phương án dự phòng: link Drive hỏng -> thử dạng lh3 -> cuối cùng hiện ô xám thay vì icon vỡ
function imgTag(v, cls){
  var u=imgSrc(v);
  if(!u) return '<span class="noimg">—</span>';
  return '<img class="'+(cls||'thumb')+'" src="'+esc(u)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)">';
}
function imgFail(im){
  // chỉ link Drive mới có ID để thử lại dạng lh3; link tạm lh7-rt không có gì để cứu
  var s=im.getAttribute('src')||'', m=/drive\.google\.com/.test(s) ? s.match(/[-\w]{25,}/) : null;
  if(m && !im._alt){ im._alt=1; im.src='https://lh3.googleusercontent.com/d/'+m[0]+'=w300'; return; }
  im.removeAttribute('src'); im.classList.add('imgx'); im.title='Ảnh không tải được';
}
var TANG_OPTS=['Tầng hầm','Tầng lửng','Tầng trệt','Tầng 1','Tầng 2','Tầng 3','Tầng 4','Tầng 5','Sân thượng'];
var PHONG_OPTS=['Phòng khách','Phòng bếp','Phòng ăn','Phòng ngủ Master','Phòng ngủ 1','Phòng ngủ 2','Phòng ngủ 3','Phòng ngủ 4','Phòng thờ','Phòng làm việc','Phòng giặt','WC / Vệ sinh','Sân trước','Sân sau','Ban công','Cầu thang','Sảnh','Hành lang'];
/* ===== Index danh mục: dựng 1 lần, dùng lại cho mọi dòng (trước đây quét lại S.products cho TỪNG dòng) ===== */
var SEP=String.fromCharCode(1);   // ngăn khoá "nhóm + hạng mục", không thể trùng ký tự trong dữ liệu
var _ix=null, _ixLen=-1;
function pidx(){
  if(_ix && _ixLen===S.products.length) return _ix;
  var nhom={}, hmAll={}, hmByNhom={}, byNhom={}, byHM={}, byBoth={}, byMa={}, byName={};
  S.products.forEach(function(p){
    var n=p.nhom||'', h=p.hangMuc||'';
    if(n){ nhom[n]=1; (byNhom[n]=byNhom[n]||[]).push(p); }
    if(h){ hmAll[h]=1; (hmByNhom[n]=hmByNhom[n]||{})[h]=1; (byHM[h]=byHM[h]||[]).push(p); }
    var bk=n+SEP+h; (byBoth[bk]=byBoth[bk]||[]).push(p);
    if(p.hinhAnh){ if(p.ma) byMa[p.ma]=p.hinhAnh; if(p.ten) byName[p.ten]=p.hinhAnh; }
  });
  var hmn={}; Object.keys(hmByNhom).forEach(function(k){ hmn[k]=Object.keys(hmByNhom[k]).sort(); });
  _ix={ nhoms:Object.keys(nhom).sort(), hmAll:Object.keys(hmAll).sort(), hmByNhom:hmn,
        byNhom:byNhom, byHM:byHM, byBoth:byBoth, byMa:byMa, byName:byName };
  _ixLen=S.products.length;
  return _ix;
}
function prodFor(nhom, loai){
  var ix=pidx();
  if(nhom && loai) return ix.byBoth[nhom+SEP+loai]||[];
  if(nhom) return ix.byNhom[nhom]||[];
  if(loai) return ix.byHM[loai]||[];
  return S.products;
}
// tra ảnh từ danh mục theo mã / tên nếu dòng chưa có ảnh
// link lh7-rt/sheetsz = link tạm của ảnh dán trong ô -> vài giờ là chết, KHÔNG được tin
function volatileImg(u){ return /googleusercontent\.com\/sheetsz/i.test(String(u||'')); }
function lineImg(l){
  var own=String(l.hinhAnh||''), ix=pidx();
  // link tự dán (Drive/http bền) -> tôn trọng lựa chọn của người dùng
  if(own.indexOf('http')===0 && !volatileImg(own)) return own;
  // còn lại luôn tra danh mục trước: ở đó là bản sao Drive vĩnh viễn.
  // Dòng cũ đang giữ link chết chép từ lúc thêm sp -> phải bỏ qua nó, không thì ảnh mất.
  var fromCat=(l.maSP&&ix.byMa[l.maSP]) || (l.ten&&ix.byName[l.ten]) || '';
  return fromCat || own;
}
/* ===== Select "nạp khi bấm": ban đầu chỉ vẽ giá trị đang chọn, bấm vào mới đổ đủ danh sách.
   Trước đây mỗi dòng vẽ sẵn hàng trăm <option> -> 40 dòng = hàng chục nghìn thẻ -> lag. ===== */
function selLazy(kind, cur, lineId, ph, w, onch){
  cur=cur||''; ph=ph||'-';
  // Nhóm & Hạng mục thường rất dài (tên sheet) -> hiện chữ ĐẦY ĐỦ, xuống dòng; select trong suốt đè lên để vẫn bấm chọn
  var wrap=(kind==='nhom'||kind==='loai');
  var sel='<select class="txt kv'+(wrap?' kvov':'')+'" style="min-width:'+(w||110)+'px"'
    +' data-fk="'+kind+'" data-id="'+lineId+'" data-cur="'+esc(cur)+'" data-ph="'+esc(ph)+'"'
    +' onmousedown="selFill(this)" onfocus="selFill(this)" onchange="'+onch+(wrap?';kvSync(this)':'')+'">'
    +(cur===''
      ? '<option value="" selected>'+esc(ph)+'</option>'
      : '<option value="">'+esc(ph)+'</option><option selected>'+esc(cur)+'</option>')
    +'</select>';
  if(!wrap) return sel;
  return '<div class="kvcell"><span class="kvtext'+(cur?'':' ph')+'">'+esc(cur||ph)+'</span>'+sel+'</div>';
}
function kvSync(el){ var c=el.closest?el.closest('.kvcell'):null; if(!c) return;
  var t=c.querySelector('.kvtext'); if(t){ t.textContent=el.value||el.getAttribute('data-ph')||'-'; t.classList.toggle('ph', !el.value); } }
function selFill(el){
  if(el._filled) return; el._filled=1;
  var kind=el.getAttribute('data-fk'), id=el.getAttribute('data-id'), cur=el.getAttribute('data-cur')||'';
  var l=localLine(id); if(!l) return;
  var opts=[], tail='';
  if(kind==='nhom')       opts=catNhoms();
  else if(kind==='loai')  opts=catHangMuc(l.nhom||'');
  else if(kind==='tang'){ opts=TANG_OPTS;  tail='<option value="__other__">＋ Khác…</option>'; }
  else if(kind==='phong'){opts=PHONG_OPTS; tail='<option value="__other__">＋ Khác…</option>'; }
  var ph=el.getAttribute('data-ph')||'-', found=false;
  var h='<option value="">'+esc(ph)+'</option>';
  for(var i=0;i<opts.length;i++){ if(cur===opts[i]) found=true; h+='<option>'+esc(opts[i])+'</option>'; }
  if(cur && !found) h+='<option>'+esc(cur)+'</option>';
  el.innerHTML=h+tail;
  el.value=cur;
}
function onKV(lineId, field, sel){
  var v=sel.value;
  if(v==='__other__'){ v=prompt('Nhập '+(field==='tang'?'tầng':'phòng')+':',''); if(v==null){ renderBoctach(); return; } }
  var f={}; f[field]=v; editLine(lineId, f);
}
// ==== Chọn Nhóm -> Hạng mục -> Tên SP (tự điền như VLOOKUP của Google Sheet) ====
function tenSelect(l){
  if(editMode(l))
    return '<input class="cell newin" id="newTen_'+l.lineId+'" style="min-width:200px;text-align:left" placeholder="Tên sản phẩm mới…" value="'+esc(l.ten)+'" onchange="editLine(\''+l.lineId+'\',{ten:this.value})">';
  // ô trên bảng chỉ hiện TÊN, nhìn như các ô select xung quanh; ảnh & giá nằm ở popup lọc ▼
  return '<button type="button" class="pp-btn" onclick="ppOpen(this,\''+l.lineId+'\')" title="'+esc(l.ten||'Chọn sản phẩm')+'">'
    +'<span class="nm'+(l.ten?'':' ph')+'">'+esc(l.ten||'-')+'</span>'
    +'<span class="car">▾</span>'
  +'</button>';
}
/* ===== Popup chọn sản phẩm: danh sách tên + tìm kiếm ===== */
var PP={ id:'', el:null, btn:null, q:'', all:false, list:[], hi:-1 };
function ppOpen(btn, lineId){
  if(PP.id===lineId && PP.el){ ppClose(); return; }
  ppClose();
  var l=localLine(lineId); if(!l) return;
  PP.id=lineId; PP.btn=btn; PP.q=''; PP.all=false; PP.hi=-1;
  var d=document.createElement('div'); d.className='pp-pop';
  d.innerHTML='<div class="hd"><input id="ppQ" placeholder="Tìm tên / mã / thương hiệu…" oninput="ppFilter(this.value)" onkeydown="ppKey(event)"></div>'
    +'<div class="pp-scope" id="ppScope"></div>'
    +'<div class="pp-list" id="ppList"></div>'
    +'<div class="pp-ft"><span id="ppCnt"></span><button onclick="ppNew()">＋ Tạo sản phẩm</button></div>';
  document.body.appendChild(d); PP.el=d;
  ppFilter('');
  ppPos();
  setTimeout(function(){ var q=document.getElementById('ppQ'); if(q) q.focus(); },10);
  setTimeout(function(){ document.addEventListener('mousedown', ppOut, true); },0);
  window.addEventListener('resize', ppPos); window.addEventListener('scroll', ppPos, true);
}
function ppPos(){
  if(!PP.el||!PP.btn) return;
  var r=PP.btn.getBoundingClientRect();
  var VH=window.innerHeight||document.documentElement.clientHeight||800;
  var VW=window.innerWidth ||document.documentElement.clientWidth ||1200;
  if(r.bottom<0||r.top>VH){ ppClose(); return; }   // dòng đã cuộn ra ngoài màn hình
  var h=PP.el.offsetHeight, w=PP.el.offsetWidth;
  var top=(r.bottom+6+h>VH && r.top-6-h>0) ? r.top-6-h : Math.min(r.bottom+6, VH-h-8);
  PP.el.style.top=Math.max(8,top)+'px';
  PP.el.style.left=Math.max(8, Math.min(r.left, VW-w-8))+'px';
}
function ppOut(ev){ if(PP.el && !PP.el.contains(ev.target) && ev.target!==PP.btn && !(PP.btn&&PP.btn.contains(ev.target))) ppClose(); }
function ppClose(){
  if(PP.el) PP.el.remove();
  document.removeEventListener('mousedown', ppOut, true);
  window.removeEventListener('resize', ppPos); window.removeEventListener('scroll', ppPos, true);
  PP.el=null; PP.btn=null; PP.id='';
}
function ppFilter(q){
  PP.q=q||''; PP.hi=-1;
  var l=localLine(PP.id); if(!l) return;
  var base = PP.all ? S.products : prodFor(l.nhom||'', l.loai||'');
  if(!base.length && !PP.all){ PP.all=true; base=S.products; }
  var s=PP.q.trim().toLowerCase();
  PP.list = s ? base.filter(function(p){
      return ((p.ten||'')+' '+(p.ma||'')+' '+(p.thuongHieu||'')+' '+(p.kichThuoc||'')).toLowerCase().indexOf(s)>=0;
    }) : base;
  var sc=document.getElementById('ppScope');
  if(sc) sc.innerHTML = (PP.all
      ? 'Đang xem <b>toàn bộ danh mục</b>'+((l.nhom||l.loai)?' · <button onclick="ppScope(0)">Lọc theo nhóm/hạng mục của dòng</button>':'')
      : 'Lọc theo: <b>'+esc([l.nhom,l.loai].filter(Boolean).join(' › ')||'—')+'</b> · <button onclick="ppScope(1)">Xem toàn bộ danh mục</button>');
  var c=document.getElementById('ppCnt'); if(c) c.textContent=PP.list.length+' sản phẩm';
  var box=document.getElementById('ppList'); if(!box) return;
  if(!PP.list.length){ box.innerHTML='<div class="empty" style="padding:22px">Không có sản phẩm khớp.</div>'; ppPos(); return; }
  var cur=l.ten||'', MAX=400;
  box.innerHTML=PP.list.slice(0,MAX).map(function(p,i){
    var sub=[p.ma,p.thuongHieu,p.kichThuoc].filter(Boolean).join(' · ');
    return '<div class="pp-item'+(p.ten===cur?' cur':'')+'" data-i="'+i+'" onmouseenter="ppHi('+i+',1)" onclick="ppPick('+i+')">'
      +(p.hinhAnh? '<img class="th" src="'+esc(imgSrc(p.hinhAnh))+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)">' : '<span class="th imgx"></span>')
      +'<div class="inf"><div class="t">'+esc(p.ten)+'</div>'+(sub?'<div class="s">'+esc(sub)+'</div>':'')+'</div>'
      +'<div class="pr"><b>'+fmt(p.donGiaBan)+'</b><span>'+esc(p.dvt||'')+'</span></div>'
    +'</div>';
  }).join('') + (PP.list.length>MAX? '<div class="empty" style="padding:10px;font-size:11px">… còn '+(PP.list.length-MAX)+' sp, hãy gõ để tìm.</div>' : '');
  ppPos();
}
function ppScope(all){ PP.all=!!all; ppFilter(PP.q); }
function ppHi(i, noScroll){
  var box=document.getElementById('ppList'); if(!box) return;
  var its=box.querySelectorAll('.pp-item');
  if(i<0||i>=its.length) return;
  its.forEach(function(e){ e.classList.remove('on'); });
  its[i].classList.add('on'); PP.hi=i;
  if(!noScroll) its[i].scrollIntoView({block:'nearest'});
}
function ppKey(ev){
  var n=Math.min(PP.list.length,400);
  if(ev.key==='ArrowDown'){ ev.preventDefault(); ppHi(PP.hi+1>=n?0:PP.hi+1); }
  else if(ev.key==='ArrowUp'){ ev.preventDefault(); ppHi(PP.hi-1<0?n-1:PP.hi-1); }
  else if(ev.key==='Enter'){ ev.preventDefault(); ppPick(PP.hi<0?0:PP.hi); }
  else if(ev.key==='Escape'){ ev.preventDefault(); ppClose(); }
}
function ppPick(i){
  var p=PP.list[i], id=PP.id; if(!p||!id) return;
  ppClose();

/* ==== Chế độ "Thêm sản phẩm": mở khoá cả dòng cho gõ tay, hiện nút 💾 ==== */
/* Trạng thái dòng nằm ngay trong sheet HẠNG MỤC (cột "Tự nhập" / "Đã lưu DM"), không để ở máy:
   mở lại ở bất kỳ máy nào cũng đúng, sửa/xoá dòng là cập nhật theo. */
function isTuNhap(l){ return !!(l && Number(l.tuNhap)); }
/* Nhóm "đóng theo yêu cầu" (4.1 Nội thất liền tường): mỗi công trình một kiểu, KHÔNG có sẵn trong
   danh mục để tra -> dòng thuộc nhóm này luôn ở chế độ gõ tay, khỏi phải bấm ＋ Thêm sản phẩm. */
function isDongRieng(n){
  var t=String(n||'').trim().toUpperCase();
  return t.indexOf('NỘI THẤT LIỀN TƯỜNG')>=0 || t.indexOf('4.1.')===0;
}
function isManual(l){ return !!(l && (isTuNhap(l) || isDongRieng(l.nhom))); }
// dòng gõ tay đã bấm 💾 lưu vào danh mục -> xám lại, icon ✅
function daLuuDanhMuc(l){ return !!(l && Number(l.daLuuDM)); }
// đang gõ dở = dòng tự nhập NHƯNG chưa lưu -> mở khoá ô nhập; lưu xong thì các ô về dạng bình thường
function editMode(l){ return isManual(l) && !daLuuDanhMuc(l); }
function newOn(id){ editLine(id,{tuNhap:1}); refreshBoc();
  setTimeout(function(){ var i=document.getElementById('newTen_'+id); if(i) i.focus(); },30); }
function newOff(id){ editLine(id,{tuNhap:0, daLuuDM:0}); refreshBoc(); }
function markSaved(id){ editLine(id,{daLuuDM:1}); }

var _ldTimer;
function startLoader(){ var pct=0; setLoader(0);
  _ldTimer=setInterval(function(){ pct+=Math.max(0.6,(92-pct)*0.06); if(pct>92)pct=92; setLoader(Math.round(pct)); },130); }
function setLoader(p,msg){ var b=document.getElementById('loaderBar'),t=document.getElementById('loaderPct'),m=document.getElementById('loaderMsg');
  if(b)b.style.width=p+'%'; if(t)t.textContent=p+'%'; if(msg&&m)m.textContent=msg; }
function finishLoader(){ clearInterval(_ldTimer); setLoader(100,'Sẵn sàng');
  setTimeout(function(){ var l=document.getElementById('loader'); if(l){ l.classList.add('hide'); setTimeout(function(){ l.style.display='none'; },360); } },300); }

/*** ================= TRANG: BÓC TÁCH ================= ***/
/* ===== Nhóm tự tạo ("+ Tiêu đề") =====
   Nhóm lấy từ 8 sheet sản phẩm là cố định. Ngoài ra người dùng tự thêm được nhóm riêng
   (vd "Phần thô", "Nhân công") — lưu theo dự án, hiện thành tab, xuất ra 1 sheet riêng. */
function myNhoms(){
  if(!S.cur) return [];
  return String(S.cur.nhomTuTao||'').split('|').map(function(s){ return s.trim(); }).filter(Boolean);
}
// nhớ kết quả: hàm này bị gọi cho từng dòng, đừng dựng lại danh sách mỗi lần
var _cnCache=null, _cnKey='';
function catNhoms(){
  var cs=S.catSheets||[];
  var key=cs.length+'|'+(S.products.length)+'|'+(S.cur?S.cur.nhomTuTao||'':'');
  if(_cnCache && _cnKey===key) return _cnCache;
  var seen={}, out=[];
  // đề mục = MỌI sheet danh mục (1.–5., theo thứ tự trong file) + nhóm có sp + nhóm tự tạo
  cs.concat(pidx().nhoms).concat(myNhoms()).forEach(function(n){ if(n && !seen[n]){ seen[n]=1; out.push(n); } });
  _cnCache=out; _cnKey=key;
  return out;
}
// nhóm tự tạo -> danh mục không có sp nào, đừng lọc kho sản phẩm về 0
function isMyNhom(n){ return myNhoms().indexOf(n)>=0 && pidx().nhoms.indexOf(n)<0; }
async function addTieuDe(){
  if(!S.cur){ toast('Chưa chọn dự án'); return; }
  var name=prompt('Tên tiêu đề (sẽ thành 1 tab và 1 sheet riêng khi xuất):','');
  if(name==null) return;
  name=name.trim(); if(!name){ toast('Chưa nhập tên'); return; }
  if(catNhoms().indexOf(name)>=0){ toast('Tên này đã có'); setBTab(name); return; }
  var list=myNhoms(); list.push(name);
  var val=list.join('|');
  S.cur.nhomTuTao=val;                       // hiện tab ngay
  setBTab(name);
  try{ await api('updateProject', S.cur.maDA, {nhomTuTao:val}); toast('Đã thêm tiêu đề: '+name); }
  catch(e){ toast('Lỗi lưu: '+(e&&e.message)); }
}
/* ===== Tầng tự thêm =====
   Tầng vốn chỉ hiện khi có dòng mang tầng đó. Nút ＋ trên dòng Tầng cho thêm tầng TRƯỚC,
   kể cả khi chưa có mục nào -> phải lưu theo dự án thì tầng rỗng mới hiện được. */
function myTangs(){
  if(!S.cur) return [];
  return String(S.cur.tangTuTao||'').split('|').map(function(s){ return s.trim(); }).filter(Boolean);
}
async function addTang(){
  if(!S.cur){ toast('Chưa chọn dự án'); return; }
  var dang={}; S.lines.forEach(function(l){ var t=(l.tang||'').trim(); if(t) dang[t]=1; });
  myTangs().forEach(function(t){ dang[t]=1; });
  var conLai=TANG_OPTS.filter(function(t){ return !dang[t]; });
  var msg='Thêm tầng — gõ tên tầng:\n\n';
  msg += conLai.length ? ('Gợi ý còn trống: '+conLai.join(', ')) : 'Đã dùng hết các tầng gợi ý.';
  var name=prompt(msg, conLai[0]||'');
  if(name==null) return;
  name=name.trim(); if(!name){ toast('Chưa nhập tên tầng'); return; }
  if(dang[name]){ toast('Tầng "'+name+'" đã có'); return; }
  var list=myTangs(); list.push(name);
  var val=list.join('|');
  S.cur.tangTuTao=val;
  refreshBoc();                     // tầng mới hiện ngay
  toast('Đã thêm tầng: '+name);
  try{ await api('updateProject', S.cur.maDA, {tangTuTao:val}); }
  catch(e){ toast('Lỗi lưu: '+(e&&e.message)); }
}
async function xoaTang(t){
  var co=S.lines.filter(function(l){ return (l.tang||'').trim()===t; }).length;
  if(co){ toast('Tầng "'+t+'" đang có '+co+' mục — chuyển hoặc xoá các mục trước'); return; }
  var val=myTangs().filter(function(x){ return x!==t; }).join('|');
  S.cur.tangTuTao=val;
  refreshBoc();
  try{ await api('updateProject', S.cur.maDA, {tangTuTao:val}); toast('Đã xoá tầng'); }
  catch(e){ toast('Lỗi: '+(e&&e.message)); }
}
async function xoaTieuDe(n){
  if(!confirm('Xoá tiêu đề "'+n+'"?\n(Các dòng đang thuộc tiêu đề này sẽ về "Chưa nhóm")')) return;
  var val=myNhoms().filter(function(x){ return x!==n; }).join('|');
  S.cur.nhomTuTao=val;
  if(S.bTab===n) S.bTab='';
  setBTab(S.bTab);
  try{ await api('updateProject', S.cur.maDA, {nhomTuTao:val}); toast('Đã xoá tiêu đề'); }

/* ===== Cầm dòng kéo sang tầng khác ===== */
var _rdrag=null;
function rowDown(ev,id){
  if(ev.button!==0) return;
  _rdrag={id:id,y:ev.clientY,moved:false,grp:null};
  document.addEventListener('mousemove',rowMove);
  document.addEventListener('mouseup',rowUp);
  ev.preventDefault(); ev.stopPropagation();
}
function rowClear(){ document.querySelectorAll('tr.grp').forEach(function(t){ t.classList.remove('grpover'); }); }
function rowMove(ev){
  if(!_rdrag) return;
  if(!_rdrag.moved && Math.abs(ev.clientY-_rdrag.y)>4) _rdrag.moved=true;
  if(!_rdrag.moved) return;
  rowClear();
  var el=document.elementFromPoint(ev.clientX,ev.clientY);
  var tr=(el&&el.closest)?el.closest('tr'):null, grp=null;
  if(tr){
    if(tr.classList.contains('grp')) grp=tr;
    else { var p=tr; while(p && !(p.classList&&p.classList.contains('grp'))) p=p.previousElementSibling; grp=p; }
  }
  if(grp){ grp.classList.add('grpover'); _rdrag.grp=grp; } else _rdrag.grp=null;
}
function rowUp(){
  document.removeEventListener('mousemove',rowMove);
  document.removeEventListener('mouseup',rowUp);
  var d=_rdrag; _rdrag=null; rowClear();
  if(!d||!d.moved||!d.grp) return;
  editLine(d.id,{tang:d.grp.getAttribute('data-tang')||''});
}

/* ===== Cầm dòng TẦNG kéo đổi thứ tự — số La Mã tự đánh lại theo vị trí, tên đi theo tầng =====
   Thứ tự lưu trong tangTuTao của dự án (danh sách tầng, ngăn bằng "|"). */
var _gdrag=null;
function grpDown(ev,name){
  if(ev.button!==0) return;
  _gdrag={name:name,y:ev.clientY,moved:false,over:null};
  document.addEventListener('mousemove',grpMove);
  document.addEventListener('mouseup',grpUp);
  ev.preventDefault(); ev.stopPropagation();
}
function grpMove(ev){
  if(!_gdrag) return;
  if(!_gdrag.moved && Math.abs(ev.clientY-_gdrag.y)>4){
    _gdrag.moved=true;
    var me=grpRow(_gdrag.name); if(me) me.classList.add('grpmoving');
  }
  if(!_gdrag.moved) return;
  rowClear();
  var el=document.elementFromPoint(ev.clientX,ev.clientY);
  var tr=(el&&el.closest)?el.closest('tr'):null, grp=null;
  if(tr){   // thả ở giữa các mục cũng tính là thả vào tầng chứa mục đó
    if(tr.classList.contains('grp')) grp=tr;
    else { var p=tr; while(p && !(p.classList&&p.classList.contains('grp'))) p=p.previousElementSibling; grp=p; }
  }
  if(grp && (grp.getAttribute('data-tang')||'')!==_gdrag.name){ grp.classList.add('grpover'); _gdrag.over=grp; }
  else _gdrag.over=null;
}
function grpRow(name){
  var rs=document.querySelectorAll('.boc-wrap tr.grp');
  for(var i=0;i<rs.length;i++) if((rs[i].getAttribute('data-tang')||'')===name) return rs[i];
  return null;
}
function grpUp(){
  document.removeEventListener('mousemove',grpMove);
  document.removeEventListener('mouseup',grpUp);
  var d=_gdrag; _gdrag=null; rowClear();
  document.querySelectorAll('tr.grpmoving').forEach(function(t){ t.classList.remove('grpmoving'); });
  if(!d||!d.moved||!d.over) return;
  var to=d.over.getAttribute('data-tang')||'', from=d.name;
  if(!from||from===to) return;
  // thứ tự đang hiện trên bảng (bỏ nhóm ảo "chưa phân tầng")
  var cur=[].slice.call(document.querySelectorAll('.boc-wrap tr.grp'))
            .map(function(t){ return t.getAttribute('data-tang')||''; }).filter(Boolean);
  var oi=cur.indexOf(from), ti=cur.indexOf(to);
  var arr=cur.filter(function(x){ return x!==from; });
  if(!to) arr.push(from);                                   // thả xuống nhóm "chưa phân tầng" -> về cuối
  else { var i=arr.indexOf(to); arr.splice(oi<ti? i+1 : i, 0, from); }   // kéo xuống -> chèn sau, kéo lên -> chèn trước
  saveTangOrder(arr);
}
async function saveTangOrder(arr){
  if(!S.cur) return;
  var val=arr.join('|');
  S.cur.tangTuTao=val;
  refreshBoc();                       // số La Mã đánh lại ngay theo vị trí mới
  try{ await api('updateProject', S.cur.maDA, {tangTuTao:val}); }
  catch(e){ toast('Lỗi lưu thứ tự tầng: '+(e&&e.message)); }
}
/* ===== Sửa tên tầng ngay trên dòng tiêu đề ===== */
function grpNameKey(ev,el){
  if(ev.key==='Enter'){ ev.preventDefault(); el.blur(); }
  else if(ev.key==='Escape'){ ev.preventDefault(); el.textContent=el.getAttribute('data-old')||''; el.blur(); }
}
async function grpRename(el){
  var old=el.getAttribute('data-old')||'', ten=(el.textContent||'').replace(/\s+/g,' ').trim();
  if(!ten || ten===old){ el.textContent=old; return; }
  var dang={}; S.lines.forEach(function(l){ var t=(l.tang||'').trim(); if(t) dang[t]=1; });
  myTangs().forEach(function(t){ dang[t]=1; });
  if(dang[ten]){ toast('Tầng "'+ten+'" đã có'); el.textContent=old; return; }
  // 1) danh sách/thứ tự tầng: thay đúng chỗ cũ để không nhảy vị trí
  var list=myTangs(), i=list.indexOf(old);
  if(i>=0) list[i]=ten; else list.push(ten);
  var val=list.join('|');
  S.cur.tangTuTao=val;
  // 2) mọi mục đang thuộc tầng cũ chuyển sang tên mới
  var ids=[];
  S.lines.forEach(function(l){
    if((l.tang||'').trim()!==old) return;
    l.tang=ten;
    if(String(l.lineId).indexOf('tmp_')===0) l._dirty=Object.assign(l._dirty||{},{tang:ten});
    else ids.push(l.lineId);
  });
  refreshBoc();
  toast('Đã đổi tên tầng'+(ids.length?(' ('+ids.length+' mục)'):''));
  try{
    await api('updateProject', S.cur.maDA, {tangTuTao:val});
    for(var k=0;k<ids.length;k++) await api('updateLine', ids[k], {tang:ten});
  }catch(e){ toast('Lỗi lưu: '+(e&&e.message)); }
}

/* ===== Kéo cạnh cột để đổi độ rộng (như Excel) ===== */

function bcVisible(){ return S.bcOrder.filter(function(k){ return S.bcOn[k]; }).map(bcDef).filter(Boolean); }
/* ===== Cột động theo đề mục: bấm tab sheet nào -> bảng hiện đúng các cột của sheet đó =====
   Cột quen (Tên, Mã, Thương hiệu…) map về field sẵn có; cột lạ -> lưu vào "Thuộc tính thêm" (l.extra). */
var SHEETCOL_KEY = {
  'TÊN SẢN PHẨM':'ten','THƯƠNG HIỆU':'thuongHieu','NHÀ CUNG CẤP':'ncc','MÃ SẢN PHẨM':'maSP',
  'HẠNG MỤC':'loai','NHÓM':'nhom','MÔ TẢ':'moTa','KÍCH THƯỚC':'kichThuoc','ĐVT':'dvt',
  'ĐƠN VỊ TÍNH':'dvt','ĐƠN GIÁ':'donGiaBan','HÌNH ẢNH':'hinhAnh','ẢNH':'hinhAnh',
  'PHÒNG':'khuVuc','KHU VỰC':'khuVuc','MÃ SỐ BẢN VẼ':'maBanVe','SỐ LƯỢNG':'soLuong','STT':null
};
function mapSheetCol(name){
  var u=String(name||'').trim().toUpperCase().replace(/\s+/g,' ');
  if(u==='') return undefined;                 // ô tiêu đề trống -> bỏ
  if(u in SHEETCOL_KEY) return SHEETCOL_KEY[u]; // key quen, hoặc null = cột app tự lo (STT)
  return 'x';                                   // cột lạ
}
function isSheetTab(){ return !!(S.bTab && S.sheetCols && S.sheetCols[S.bTab]); }
// TẤT CẢ cột của 1 sheet (để dựng chip). key ổn định: cột quen = field key; cột lạ = "x::"+tên cột
function sheetColsFor(sheet){
  var used={}, out=[];
  ['stt','tang','khuVuc'].forEach(function(k){ used[k]=1; out.push(bcDef(k)); });   // cột app dẫn đầu
  (S.sheetCols[sheet]||[]).forEach(function(name){
    var key=mapSheetCol(name);
    if(key===undefined || key===null || used[key]) return;
    if(key==='x'){ var xk='x::'+name; if(!used[xk]){ used[xk]=1; out.push({k:xk, l:name, t:'extra', ename:name, w:150}); } }  // cột lạ
    else { used[key]=1; var d=bcDef(key); if(d) out.push(Object.assign({}, d, {l:name})); } // nhãn theo sheet
  });
  ['soLuong','donGiaVon','lnPct','donGiaBan','chietKhau','thanhTienBan'].forEach(function(k){  // cột tính tiền
    if(!used[k]){ used[k]=1; var d=bcDef(k); if(d) out.push(d); }
  });
  // áp thứ tự cột người dùng đã kéo (nếu có) — cột mới chưa có trong thứ tự thì nối sau
  var ord=(S.sheetColOrder&&S.sheetColOrder[sheet])||null;
  if(ord && ord.length){
    var byId={}; out.forEach(function(c){ byId[c.k]=c; });
    var res=[]; ord.forEach(function(id){ if(byId[id]){ res.push(byId[id]); delete byId[id]; } });
    out.forEach(function(c){ if(byId[c.k]) res.push(c); });
    out=res;
  }
  return out;
}
// chip bật/tắt cột trong chế độ sheet -> nhớ theo từng sheet (ở máy), lọc ra cột đang hiện
function sheetColLoad(){ if(S._scoLoaded) return;
  try{ S.sheetColOff=JSON.parse(localStorage.getItem('qs_sheetcoloff')||'{}')||{}; }catch(e){ S.sheetColOff={}; }
  try{ S.sheetColOrder=JSON.parse(localStorage.getItem('qs_sheetcolorder')||'{}')||{}; }catch(e){ S.sheetColOrder={}; }
  S._scoLoaded=1; }
function sheetColSave(){ try{ localStorage.setItem('qs_sheetcoloff', JSON.stringify(S.sheetColOff||{}));
  localStorage.setItem('qs_sheetcolorder', JSON.stringify(S.sheetColOrder||{})); }catch(e){} }
function sheetColOff(sheet){ return (S.sheetColOff&&S.sheetColOff[sheet])||{}; }
function sheetColToggle(sheet, id){ var m=S.sheetColOff=S.sheetColOff||{}, s=m[sheet]=m[sheet]||{};
  if(s[id]) delete s[id]; else s[id]=1; sheetColSave(); refreshBoc(); }
function sheetColsVis(sheet){ var off=sheetColOff(sheet); return sheetColsFor(sheet).filter(function(c){ return !off[c.k]; }); }
function editExtra(id, el){

  l.extra=l.extra||{}; l.extra[el.getAttribute('data-en')]=el.value;

function bcChips(){

var _cdrag=null;
function thDown(ev,k){
  if(ev.button!==0) return;
  _cdrag={key:k,x:ev.clientX,moved:false};
  document.addEventListener('mousemove',thMove);
  document.addEventListener('mouseup',thUp);
  ev.preventDefault();
}
function thAt(x,y){ var el=document.elementFromPoint(x,y); return (el&&el.closest)?el.closest('th[data-ck]'):null; }
function thClear(){ document.querySelectorAll('th[data-ck]').forEach(function(t){ t.classList.remove('thover','thdrag'); }); }
function thMove(ev){
  if(!_cdrag) return;
  if(!_cdrag.moved && Math.abs(ev.clientX-_cdrag.x)>4) _cdrag.moved=true;
  if(!_cdrag.moved) return;
  thClear();
  var src=document.querySelector('th[data-ck="'+_cdrag.key+'"]'); if(src) src.classList.add('thdrag');
  var th=thAt(ev.clientX,ev.clientY);
  if(th && th.getAttribute('data-ck')!==_cdrag.key) th.classList.add('thover');
}
function thUp(ev){
  document.removeEventListener('mousemove',thMove);
  document.removeEventListener('mouseup',thUp);
  var d=_cdrag; _cdrag=null; thClear();
  if(!d||!d.moved) return;
  var th=thAt(ev.clientX,ev.clientY); if(!th) return;
  var to=th.getAttribute('data-ck');
  if(!to||to===d.key) return;
  if(isSheetTab()){   // sheet-mode: đổi thứ tự trong bộ cột riêng của sheet đó
    var sheet=S.bTab, order=sheetColsFor(sheet).map(function(c){ return c.k; });
    var fi=order.indexOf(d.key), toi=order.indexOf(to);
    if(fi<0||toi<0) return;
    order.splice(fi,1); order.splice(toi,0,d.key);
    S.sheetColOrder=S.sheetColOrder||{}; S.sheetColOrder[sheet]=order; sheetColSave(); refreshBoc();
    return;
  }
  var from=S.bcOrder.indexOf(d.key), ti=S.bcOrder.indexOf(to);
  if(from<0||ti<0) return;
  S.bcOrder.splice(from,1); S.bcOrder.splice(ti,0,d.key);
  bcSave(); refreshBoc();
}
var _bcDrag=-1;
function bcDragStart(ev,i){ _bcDrag=i; ev.dataTransfer.effectAllowed='move'; ev.dataTransfer.setData('text/plain','__col__'); }
function bcDragOver(ev){ ev.preventDefault(); ev.dataTransfer.dropEffect='move'; }
function bcDrop(ev,i){ ev.preventDefault(); ev.stopPropagation();
  if(_bcDrag<0||_bcDrag===i) return;
  var k=S.bcOrder.splice(_bcDrag,1)[0]; S.bcOrder.splice(i,0,k); _bcDrag=-1; bcSave(); refreshBoc();
}
// kéo ngay trên tiêu đề cột của bảng để đổi thứ tự
var _bcKey=null;
function bcThStart(ev,k){ _bcKey=k; ev.dataTransfer.effectAllowed='move'; ev.dataTransfer.setData('text/plain','__col__'); ev.stopPropagation(); }
function bcThDrop(ev,k){ ev.preventDefault(); ev.stopPropagation();
  if(!_bcKey||_bcKey===k) return;
  var from=S.bcOrder.indexOf(_bcKey), to=S.bcOrder.indexOf(k);
  if(from<0||to<0){ _bcKey=null; return; }
  S.bcOrder.splice(from,1); S.bcOrder.splice(to,0,_bcKey); _bcKey=null; bcSave(); refreshBoc();
}

/* cuộn ngang kiểu Excel: thanh ngang dính đáy màn hình + Shift/lăn ngang ở bất kỳ chỗ nào trên bảng */
var _hsSync=false;
function _hsEls(){ return [document.getElementById('bocWrap'), document.getElementById('bocHsc')]; }
function hscScroll(){ if(_hsSync) return; var e=_hsEls(); if(!e[0]||!e[1]) return; _hsSync=true; e[0].scrollLeft=e[1].scrollLeft; _hsSync=false; }
function bocWrapScroll(){ if(_hsSync) return; var e=_hsEls(); if(!e[0]||!e[1]) return; _hsSync=true; e[1].scrollLeft=e[0].scrollLeft; _hsSync=false; }
function bocWheel(ev){
  var e=_hsEls(); var w=e[0]; if(!w) return;
  var dx=ev.deltaX;
  if(!dx && (ev.shiftKey||ev.altKey)) dx=ev.deltaY;
  if(!dx) return;
  var before=w.scrollLeft;
  w.scrollLeft=before+dx;
  if(w.scrollLeft!==before){
    ev.preventDefault();
    if(e[1]){ _hsSync=true; e[1].scrollLeft=w.scrollLeft; _hsSync=false; }
  }
}

/* ===== Panel catalog bên trái: accordion theo phần + chip lọc thuộc tính + danh sách SP ===== */
function prodAttrs(p){
  var txt=(p.ten||'')+' '+(p.moTa||'')+' '+(p.kichThuoc||'');
  var cs=(txt.match(/\b(\d{1,3})\s*W\b/i)||[])[1];
  var nd=(txt.match(/\b(\d{4})\s*K\b/i)||[])[1];
  var ga=(txt.match(/(\d{1,3}(?:\s*x\s*\d{1,3})?)\s*°/)||[])[1];
  return { cs:cs?cs+'W':'', nd:nd?nd+'K':'', ga:ga?ga.replace(/\s/g,'')+'°':'', th:(p.thuongHieu||'').trim() };
}
function ctColor(v){ var k=parseInt(v,10); if(k<=2800) return '#e8842a'; if(k<=3600) return '#f2a93b'; if(k<=4600) return '#f7d24b'; return '#cfe0f5'; }
function catCatsCount(){ var c={}; S.products.forEach(function(p){ var n=p.nhom||'(khác)'; c[n]=(c[n]||0)+1; }); return c; }
function projectProducts(){ var u={}; (S.lines||[]).forEach(function(l){ if(l.ten) u[String(l.ten).trim()]=1; });
  return S.products.filter(function(p){ return u[String(p.ten||'').trim()]; }); }
function catFilterProds(base){
  var q=(S._cpq||'').toLowerCase(), a=S.attr||{}, sel=function(o){ return o&&Object.keys(o).length; };
  return base.filter(function(p){
    if(q && ((p.ten||'')+' '+(p.ma||'')+' '+(p.thuongHieu||'')).toLowerCase().indexOf(q)<0) return false;
    var at=prodAttrs(p);
    if(sel(a.cs)&&!a.cs[at.cs]) return false;
    if(sel(a.nd)&&!a.nd[at.nd]) return false;
    if(sel(a.ga)&&!a.ga[at.ga]) return false;
    if(sel(a.th)&&!a.th[at.th]) return false;
    return true;
  });
}
function catSectionProds(n){ return catFilterProds(n==='__prj__'? projectProducts() : prodFor(n,'')); }
function attrOptions(base){
  var cs={},nd={},ga={},th={};
  base.forEach(function(p){ var a=prodAttrs(p); if(a.cs)cs[a.cs]=1; if(a.nd)nd[a.nd]=1; if(a.ga)ga[a.ga]=1; if(a.th)th[a.th]=1; });
  var num=function(o){ return Object.keys(o).sort(function(a,b){ return (parseInt(a,10)||0)-(parseInt(b,10)||0); }); };
  return { cs:num(cs), nd:num(nd), ga:num(ga), th:Object.keys(th).sort() };
}
function attrGroup(label,key,vals,style){
  if(!vals.length) return '';
  var selo=(S.attr&&S.attr[key])||{};
  var cls=style===2?'attr-grid':'attr-wrap';
  var chips=vals.map(function(v){
    var sw=style===1?'<span class="sw" style="background:'+ctColor(v)+'"></span>':'';
    return '<span class="attr-chip'+(selo[v]?' on':'')+'" onclick=\'attrToggle("'+key+'",'+JSON.stringify(v)+')\'>'+sw+esc(v)+'</span>';
  }).join('');
  return '<div class="attr-grp"><div class="lb">'+esc(label)+'</div><div class="'+cls+'">'+chips+'</div></div>';
}
function catProdRow(p,i){
  var sub=[p.kichThuoc,p.thuongHieu].filter(Boolean).join(' · '), idx=S.products.indexOf(p);
  return '<div class="cp-prod" draggable="true" ondragstart="dragStartProd(event,'+idx+')">'
    +'<span class="no">'+(i+1)+'</span>'
    +(p.hinhAnh?'<img class="th" src="'+esc(imgSrc(p.hinhAnh))+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)">':'<span class="th imgx"></span>')

function catPanel(){
  if(!S.products.length) return '<div class="cp-panel-empty">Danh mục trống.<br><button class="btn ghost sm" style="margin-top:10px" onclick="syncCatalog(this)">🔄 Đồng bộ danh mục</button></div>';
  var counts=catCatsCount();
  var cats=catNhoms().filter(function(n){ return counts[n]; });
  var opts=attrOptions(S.products);   // chip lọc lấy từ toàn bộ danh mục (ổn định)
  var acc=catSection('__prj__','Được chọn bởi dự án',projectProducts().length)
    +cats.map(function(n){ return catSection(n,n,counts[n]); }).join('');
  var chips=attrGroup('Công suất','cs',opts.cs,0)+attrGroup('Nhiệt độ màu','nd',opts.nd,1)+attrGroup('Góc chiếu','ga',opts.ga,2)+attrGroup('Thương hiệu','th',opts.th,0);
  return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><b style="font-size:13px;flex:1">Danh mục sản phẩm</b><button class="btn ghost sm" style="padding:4px 8px" onclick="syncCatalog(this)">🔄</button></div>'
    +'<div class="cp-search"><span class="mag">🔍</span><input id="cpSearch" placeholder="Tìm tên / mã…" value="'+esc(S._cpq||'')+'" oninput="catSearch(this.value)"></div>'
    +acc+chips;
}
function renderCatPanel(){ var el=document.getElementById('catPanel'); if(el) el.innerHTML=catPanel(); }
function catAccToggle(n){ S.catOpen=S.catOpen||{}; if(S.catOpen[n]) delete S.catOpen[n]; else S.catOpen[n]=1; renderCatPanel(); }
function attrToggle(k,v){ S.attr=S.attr||{}; var o=S.attr[k]=S.attr[k]||{}; if(o[v]) delete o[v]; else o[v]=1; renderCatPanel(); }
function catSearch(v){ S._cpq=v; renderCatPanel();

function refreshBoc(){

function dragStartProd(ev, idx){ ev.dataTransfer.setData('text/plain', String(idx)); ev.dataTransfer.effectAllowed='copy'; }
function dragOver(ev, el){ ev.preventDefault(); ev.dataTransfer.dropEffect='copy'; if(el) el.classList.add('drag'); }

async function dropTo(ev, tang){
  ev.preventDefault(); ev.stopPropagation();
  document.querySelectorAll('.drag').forEach(function(e){ e.classList.remove('drag'); });
  var idx=parseInt(ev.dataTransfer.getData('text/plain'),10);

function renderCatalog(){
  var si=document.getElementById('catSearch'); var q=(si?si.value:'').toLowerCase();
  var mn=Number(S.fMin)||0, mx=Number(S.fMax)||0;
  var list=S.products.filter(function(p){
    if(S.fNhom && p.nhom!==S.fNhom) return false;
    if(S.fHM && p.hangMuc!==S.fHM) return false;
    if(q && (p.ten+' '+p.ma+' '+p.hangMuc+' '+p.thuongHieu).toLowerCase().indexOf(q)<0) return false;
    if(mn && (Number(p.donGiaBan)||0)<mn) return false;

    return true;
  });
  var cc=document.getElementById('catCount'); if(cc) cc.textContent=list.length+' sp';
  if(!list.length) return '<tr><td colspan="8" class="empty">Không có sản phẩm khớp.</td></tr>';

    return '<tr class="catrow" draggable="true" ondragstart="dragStartProd(event,'+idx+')">'
      +'<td>'+imgTag(p.hinhAnh)+'</td>'

function lineRowBoctach(l,no,alt){

  var cls=l._pending?'pending':(xong?'savedrow':(isNew?'newrow':(alt?'alt':'')));
  // Dòng đang chờ server cấp mã: chưa cho xoá/lưu, tránh xoá nhầm dòng vừa được tạo xong
  var act=l._pending
    ? '<span class="row-wait" title="Đang lưu…">⏳</span>'
    : (isNew
        ? (xong
            ? '<span class="row-ok" title="Đã có trong danh mục sản phẩm">✅</span>'
            : '<span class="row-save" title="Lưu thành sản phẩm mới trong sheet của Nhóm" onclick="saveAsProduct(\''+l.lineId+'\',this)">💾</span>')
          // ↩ chỉ hiện lúc đang gõ dở (chưa lưu); lưu xong ô đã về bình thường nên bỏ
          +((!xong && isTuNhap(l))?'<span class="row-undo" title="Bỏ, quay lại chọn từ danh mục" onclick="newOff(\''+l.lineId+'\')">↩</span>':'')

async function saveAsProduct(id, el){
  var l=localLine(id); if(!l) return;
  var ten=String(l.ten||'').trim(), nhom=String(l.nhom||'').trim();
  if(!ten){ toast('Chưa có TÊN SẢN PHẨM'); return; }
  if(!nhom){ toast('Chọn NHÓM trước — nhóm chính là sheet sẽ lưu vào'); return; }
  if(!confirm('Lưu "'+ten+'" thành sản phẩm mới trong sheet:\n'+nhom+' ?')) return;
  var old=el.textContent; el.textContent='⏳'; el.onclick=null;
  try{
    var p=await api('saveLineAsProduct',{
      nhom:nhom, hangMuc:l.loai, ten:ten, thuongHieu:l.thuongHieu, ncc:l.ncc, ma:l.maSP,
      moTa:l.moTa, kichThuoc:l.kichThuoc, dvt:l.dvt, gia:l.donGiaBan, hinhAnh:l.hinhAnh
    });
    if(p) S.products.push(p);
    toast('Đã lưu vào sheet: '+nhom);
    el.textContent='✅';
    if(document.getElementById('catBody')) filterCatalog();
    markSaved(id);                 // dòng chuyển xám + ✅, vẫn sửa/xoá được bình thường
    setTimeout(refreshBoc, 700);
  }catch(e){
    var msg=String((e&&e.message)||'');
    if(msg.indexOf('đã có sẵn')>=0){     // trùng sản phẩm trong sheet -> coi như đã lưu rồi
      toast('Sản phẩm này đã có trong danh mục');
      markSaved(id); setTimeout(refreshBoc, 300); return;
    }
    toast('Lỗi: '+msg);
    el.textContent=old; el.onclick=function(){ saveAsProduct(id,el); };
  }
}

function prodToLine(p, tang){
  var von=Number(p.donGiaVon)||0, ban=Number(p.donGiaBan)||von;
  return { nhom:p.nhom||'', loai:p.hangMuc||p.loai||'', maSP:p.ma||'', ten:p.ten||'',
    thuongHieu:p.thuongHieu||'', moTa:p.moTa||'', kichThuoc:p.kichThuoc||'',
    hinhAnh:p.hinhAnh||p.link||'', dvt:p.dvt||'Cái', soLuong:1,
    donGiaVon:von, lnPct:(von>0?Math.round((ban-von)/von*100):(Number(p.lnPct)||0)),
    donGiaBan:ban, thanhTienVon:Math.round(von), thanhTienBan:Math.round(ban),
    khuVuc:p.khuVuc||'', ncc:p.ncc||'', maBanVe:p.maBanVe||'', tang:tang||p.tang||'',
    chietKhau:Number(p.chietKhau)||0, trangThai:p.trangThai||'', ghiChu:p.ghiChu||'' };

async function addOptimistic(tmp, call){
  S.lines.push(tmp); S.linesByDA[S.cur.maDA]=S.lines;
  refreshBoc();                       // dòng hiện ngay, chưa cần server
  try{
    var real=await call();
    var i=S.lines.indexOf(tmp);
    if(!real||!real.lineId){ if(i>=0) S.lines.splice(i,1); refreshBoc(); toast('Không thêm được dòng'); return null; }
    var dirty=tmp._dirty;
    if(i>=0) S.lines[i]=real; else S.lines.push(real);
    // người dùng sửa gì trong lúc chờ thì gửi tiếp cho server, không để mất
    // (gồm cả cờ Tự nhập / Đã lưu DM nếu bấm trong lúc dòng còn mã tạm)
    if(dirty){
      Object.keys(dirty).forEach(function(k){ real[k]=dirty[k]; });
      recalcLine(real, dirty);
      api('updateLine', real.lineId, dirty).catch(function(e){ toast('Lỗi lưu: '+(e&&e.message)); });
    }
    refreshBoc(); return real;
  }catch(e){
    var j=S.lines.indexOf(tmp); if(j>=0) S.lines.splice(j,1);
    refreshBoc(); toast('Lỗi: '+(e&&e.message)); return null;
  }
}
// tìm dòng ĐANG CÓ trùng sản phẩm để cộng dồn số lượng thay vì tạo dòng mới
// khớp: cùng SP (mã, nếu không có mã thì theo tên) + cùng Tầng + cùng Phòng
function findSameLine(p, tang, khuVuc){
  var ma=String((p.ma||p.maSP)||'').trim(), ten=String(p.ten||'').trim();
  var tg=String(tang||'').trim(), kv=String(khuVuc||'').trim();
  return (S.lines||[]).filter(function(l){
    if(String(l.tang||'').trim()!==tg) return false;
    if(String(l.khuVuc||'').trim()!==kv) return false;
    if(ma) return String(l.maSP||'').trim()===ma;
    return ten && String(l.ten||'').trim()===ten;
  })[0];
}
// thêm sản phẩm: nếu đã có (cùng SP + tầng + phòng) -> +1 số lượng; chưa có -> tạo dòng mới
function addProduct(p, tang){
  var same=findSameLine(p, tang, '');
  if(same){
    var q=(Number(same.soLuong)||0)+1;
    editLine(same.lineId, {soLuong:q});
    toast('+1 số lượng: '+p.ten+' (SL '+q+')');
    return;
  }
  var prod = tang ? Object.assign({}, p, {tang:tang}) : p;
  toast('Đã thêm: '+p.ten+(tang?(' → '+tang):''));
  return addOptimistic(tmpLine(prodToLine(p, tang)), function(){ return api('addLine', S.cur.maDA, prod, 1); });
}
function addFromCatalog(idx){
  var p=S.products[idx]; if(!p) return;
  return addProduct(p, '');
}
// tang: thêm thẳng vào tầng đó. Đang xem 1 tab -> gán luôn nhóm của tab, khỏi dòng mới bị nhảy đi chỗ khác.
function addBlank(tang){
  tang = tang || '';
  var nhom = (S.bTab && S.bTab!=='(Chưa nhóm)') ? S.bTab : '';
  var over = {ten:'Hạng mục mới'};
  if(tang) over.tang = tang;
  if(nhom) over.nhom = nhom;
  return addOptimistic(tmpLine(over), function(){
    return api('addBlankLine', S.cur.maDA, {tang:tang, nhom:nhom});
  });
}
// tính lại tiền ngay tại trình duyệt (khớp đúng công thức server) -> UI không phải chờ server
function recalcLine(l, fields){
  var num=['soLuong','donGiaVon','lnPct','donGiaBan','chietKhau'];
  num.forEach(function(k){ if(fields.hasOwnProperty(k)) l[k]=Number(fields[k])||0; });
  var sl=Number(l.soLuong)||0, von=Number(l.donGiaVon)||0;
  if(fields.hasOwnProperty('donGiaBan')) l.lnPct = von>0 ? Math.round(((Number(l.donGiaBan)||0)-von)/von*100) : 0;
  else if(fields.hasOwnProperty('donGiaVon')||fields.hasOwnProperty('lnPct'))
    l.donGiaBan = Math.round(von*(1+(Number(l.lnPct)||0)/100));
  l.thanhTienVon = Math.round(sl*von);
  l.thanhTienBan = Math.round(sl*(Number(l.donGiaBan)||0));
}
// vẽ lại đúng 1 dòng thay vì cả bảng
function rowRefresh(lineId){
  if(fltCount()) return false;                       // đang lọc -> dòng có thể phải ẩn/hiện, vẽ lại cả bảng
  var tr=document.querySelector('tr[data-lid="'+lineId+'"]'); if(!tr) return false;
  var l=localLine(lineId); if(!l) return false;
  _bcCols=isSheetTab()?sheetColsVis(S.bTab):bcVisible();   // giữ đúng bộ cột đang hiện (sheet hay chip)
  tr.outerHTML=lineRowBoctach(l, Number(tr.getAttribute('data-no'))||1, tr.classList.contains('alt'));
  growAll();
  if(document.getElementById('bgTot')) updateBgTot();   // sửa giá/SL ở tab Xuất báo giá -> cập nhật tổng ngay
  return true;
}
function editLine(lineId, fields){   // cập nhật tức thì, lưu server ở nền
  var l=localLine(lineId);
  if(l){
    Object.keys(fields).forEach(function(k){ l[k]=fields[k]; });
    recalcLine(l, fields);
  }
  // đổi Tầng/Nhóm -> đổi nhóm gộp & số đếm tab -> phải vẽ lại cả bảng; còn lại chỉ vẽ 1 dòng
  var heavy = fields.hasOwnProperty('tang')||fields.hasOwnProperty('nhom');
  if(heavy) refreshBoc();
  else if(!rowRefresh(lineId)) refreshBoc();
  // dòng chưa có mã thật (server đang tạo) -> giữ lại, addOptimistic sẽ gửi khi có mã
  if(String(lineId).indexOf('tmp_')===0){
    if(l) l._dirty = Object.assign(l._dirty||{}, fields);
    return;
  }
  api('updateLine', lineId, fields).catch(function(e){ toast('Lỗi lưu: '+(e&&e.message)); });
}
function removeLine(lineId){
  S.lines=S.lines.filter(function(l){ return l.lineId!==lineId; });
  S.linesByDA[S.cur.maDA]=S.lines;
  refreshBoc(); toast('Đã xoá');
  api('deleteLine', lineId).catch(function(e){ toast('Lỗi xoá: '+(e&&e.message)); });
}

function drawChiphi(){

    +(S.lines.length? cpTabs()+'<div class="tbl-wrap"><table style="min-width:900px"><thead><tr><th>STT</th><th>Mã</th><th>Nhóm</th><th>Tên sản phẩm</th><th>ĐVT</th><th class="num">SL</th><th class="num">Đơn giá vốn</th><th class="num">% LN</th><th class="num">Đơn giá bán</th><th class="num">T.tiền vốn</th><th class="num">T.tiền bán</th></tr></thead><tbody>'+(rows||'<tr><td colspan="11" class="empty">Không có hạng mục trong đề mục này.</td></tr>')+'</tbody></table></div>'

function coverSort(a,b){ var ka=coverKey(a.stt),kb=coverKey(b.stt),n=Math.max(ka.length,kb.length); for(var i=0;i<n;i++){ var d=(ka[i]||0)-(kb[i]||0); if(d) return d; } return 0; }

  var list=(S.cover||[]).slice().sort(coverSort), groups=[], cur=null;
  list.forEach(function(c){
    if(String(c.stt).split('.').length===1){ cur={sec:c, items:[]}; groups.push(cur); }
    else if(cur){ cur.items.push(c); }
    else { cur={sec:null, items:[c]}; groups.push(cur); }
  });
  return groups;
}
function coverTotals(groups){
  var sec={}, grand=0;

    if(g.sec && !t) t=Number(g.sec.chiPhi)||0;
    if(g.sec) sec[g.sec.stt]=t;
    grand+=t;
  });
  return {sec:sec, grand:grand};
}
