    // 6 cột: No | HẠNG MỤC(gộp) | NỘI DUNG | CHI PHÍ | TỶ TRỌNG | MÔ TẢ
    body='<table><colgroup><col style="width:44px"><col style="width:200px"><col><col style="width:140px"><col style="width:74px"><col style="width:230px"></colgroup>'
      +'<thead><tr><th>No</th><th>HẠNG MỤC</th><th>NỘI DUNG</th><th>CHI PHÍ DỰ KIẾN</th><th>TỶ TRỌNG</th><th>MÔ TẢ</th></tr></thead><tbody>';
    groups.forEach(function(g){
      var rows=g.items.length?g.items:[g.sec];   // mục không có con -> chính nó là 1 dòng
      rows.forEach(function(it,idx){
        var v=Number(it.chiPhi)||0;
        body+='<tr>';
        if(idx===0){
          body+=g.sec?noCell(g.sec.stt, rows.length, g.sec.stt):'<td class="no" rowspan="'+rows.length+'"></td>';
          body+='<td class="sc" rowspan="'+rows.length+'" '+(g.sec?ced(g.sec.stt,'hangMuc'):'')+'>'+esc(g.sec?g.sec.hangMuc:'')+'</td>';
        }
        var isSelf=(it===g.sec);
        body+='<td><span class="nm" '+ced(it.stt,'hangMuc')+'>'+esc(isSelf?'':it.hangMuc)+'</span></td>'
          +'<td class="money" '+ced(it.stt,'chiPhi')+'>'+fmt(v)+'</td>'
          +'<td class="pct">'+pctOf(v,grand)+'</td>'
          +'<td><span class="ds" '+ced(it.stt,'moTa')+'>'+esc(it.moTa||'')+'</span></td>'
        +'</tr>';
      });
    });
    body+='</tbody><tfoot><tr><td colspan="3" style="text-align:right">TỔNG CHI PHÍ DỰ KIẾN (VNĐ)</td><td class="money">'+fmt(grand)+'</td><td colspan="2"></td></tr></tfoot></table>';
  } else {
    // 4 cột: No | HẠNG MỤC(tên+mô tả) | CHI PHÍ | TỶ TRỌNG; section = dải xám
    body='<table><colgroup><col style="width:52px"><col><col style="width:150px"><col style="width:80px"></colgroup>'
      +'<thead><tr><th>No</th><th>HẠNG MỤC</th><th>CHI PHÍ DỰ KIẾN</th><th>TỶ TRỌNG</th></tr></thead><tbody>';
    groups.forEach(function(g){
      if(g.sec){
        var sv=tot.sec[g.sec.stt]||0;
        body+='<tr class="sec">'+noCell(g.sec.stt, 0, g.sec.stt)
          +'<td class="sc" '+ced(g.sec.stt,'hangMuc')+'>'+esc(g.sec.hangMuc)+'</td>'
          +'<td class="money">'+fmt(sv)+'</td><td class="pct">'+pctOf(sv,grand)+'</td></tr>';
      }
      g.items.forEach(function(it){
        var v=Number(it.chiPhi)||0;
        body+='<tr>'+noCell(it.stt, 0, it.stt)
          +'<td><span class="nm" '+ced(it.stt,'hangMuc')+'>'+esc(it.hangMuc)+'</span>'
             +'<div class="ds" '+ced(it.stt,'moTa')+' data-ph="Mô tả…">'+esc(it.moTa||'')+'</div></td>'
          +'<td class="money" '+ced(it.stt,'chiPhi')+'>'+fmt(v)+'</td>'
          +'<td class="pct">'+pctOf(v,grand)+'</td></tr>';
      });
    });
    body+='</tbody><tfoot><tr><td colspan="2" style="text-align:right">TỔNG CHI PHÍ DỰ KIẾN (VNĐ)</td><td class="money">'+fmt(grand)+'</td><td></td></tr></tfoot></table>';
  }
  document.getElementById('coverPreview').innerHTML='<div class="cvr">'+header+infoBlock+body+'</div>';
}
// sửa 1 ô ngay trên tờ bìa
function coverCellEdit(el, f){
  var stt=el.getAttribute('data-stt'), txt=(el.innerText||'').trim();
  if(!stt){ coverInfo(f, txt); return; }   // ô thông tin dự án
  var c=(S.cover||[]).filter(function(x){ return String(x.stt)===String(stt); })[0]; if(!c) return;
  if(f==='chiPhi') c.chiPhi=Number(txt.replace(/[^\d]/g,''))||0;
  else if(f==='stt') c.stt=txt.replace(/[^\d.]/g,'').replace(/\.+/g,'.').replace(/^\.|\.$/g,'')||c.stt;  // chỉ giữ số + dấu chấm
  else c[f]=txt;
  renderCover();   // renderCover sắp xếp lại theo stt -> dòng tự nhảy đúng vị trí
}
function coverDel(stt){ S.cover=(S.cover||[]).filter(function(x){ return String(x.stt)!==String(stt); }); renderCover(); }
// thêm MỤC LỚN (cấp 1) mới ở cuối
function coverAddSec(){
  var mx=0; (S.cover||[]).forEach(function(c){ var n=parseInt(String(c.stt).split('.')[0],10)||0; if(n>mx) mx=n; });
  S.cover=S.cover||[]; S.cover.push({stt:String(mx+1), hangMuc:'MỤC MỚI', moTa:'', chiPhi:0});
  renderCover();
}
// thêm MỤC NHỎ dưới mục lớn cuối cùng (số con kế tiếp) — người dùng gõ lại số ở cột No nếu muốn chèn chỗ khác
function coverAddItem(){
  var groups=coverGroups(), lastSec=null;
  for(var i=groups.length-1;i>=0;i--){ if(groups[i].sec){ lastSec=groups[i]; break; } }
  var stt;
  if(lastSec){
    var mx=0; lastSec.items.forEach(function(it){ var pp=String(it.stt).split('.'); var n=parseInt(pp[pp.length-1],10)||0; if(n>mx) mx=n; });
    stt=lastSec.sec.stt+'.'+(mx+1);
  } else stt='1.1';
  S.cover=S.cover||[]; S.cover.push({stt:stt, hangMuc:'Nội dung mới', moTa:'', chiPhi:0});
  renderCover();
}
async function coverInfo(f,v){ S.cur[f]=v; syncProject(S.cur); renderCover(); refreshTop(); try{ var d={}; d[f]=v; await api('updateProject', S.cur.maDA, d); }catch(e){} }
async function reloadCover(){
  try{ S.cover = await api('buildCoverFromTemplate', S.cur.maDA) || []; renderCover(); toast('Đã nạp mẫu + tự cộng từ báo giá — nhớ bấm "Lưu tờ bìa"'); }
  catch(e){ toast('Lỗi: '+(e&&e.message)); }
}
async function saveCover(btn){ var o=btn.textContent; btn.disabled=true; btn.textContent='Đang lưu…';
  try{ S.cover=await api('saveCover', S.cur.maDA, S.cover)||S.cover; toast('Đã lưu tờ bìa'); renderCover(); }
  catch(e){ toast('Lỗi: '+(e&&e.message)); } btn.disabled=false; btn.textContent=o; }

async function exportFile(fmt, btn){
  if(!S.cur){ toast('Chưa chọn dự án'); return; }
  // cột xuất = đúng cột đang hiện ở bảng chi tiết (giống Bóc tách); bỏ cột lạ vì server chưa hỗ trợ
  var vis = isSheetTab()?sheetColsVis(S.bTab):bcVisible();
  var cols = vis.filter(function(c){ return c.t!=='extra'; })
                .map(function(c){ return {key:c.k, label:c.l, num:(c.t==='num'||c.t==='money')}; });
  if(!cols.length){ toast('Bật ít nhất 1 cột'); return; }
  var old=btn.textContent; btn.disabled=true; btn.textContent='Đang xuất…';
  try{
    if(S.cover) { try{ await api('saveCover', S.cur.maDA, S.cover); }catch(e){} }
    if(fmt==='pdf'){
      await printQuote(S.cur.maDA, cols);   // PDF = In → Lưu PDF của trình duyệt
      toast('Mở cửa sổ in — chọn "Lưu thành PDF"');
    } else {
      var res = await api('exportBaoGia', S.cur.maDA, cols, fmt);
      downloadBlob(res); toast('Đã xuất '+fmt.toUpperCase());
    }
  }catch(e){ toast('Lỗi xuất: '+(e&&e.message||'')); }
  btn.disabled=false; btn.textContent=old;
}
// PDF phía client: dựng 1 trang in tự chứa (bìa + chi tiết theo Nhóm/Tầng) rồi window.print()
async function printQuote(maDA, cols){
  var q = await api('getQuote', maDA) || {lines:[]};
  var cover = await api('getCoverOrInit', maDA) || [];
  var p = q.project || {};
  function money(n){ return (Math.round(Number(n)||0)).toLocaleString('vi-VN'); }
  function esc2(s){ return String(s==null?'':s).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];}); }
  // Tờ bìa
  var costBy={}, total=0;
  cover.forEach(function(c){ costBy[c.stt]=Number(c.chiPhi)||0; });
  cover.forEach(function(c){ if(String(c.stt).split('.').length===1) total+=costBy[c.stt]||0; });
  var coverRows = cover.slice().sort(function(a,b){
    function k(s){return String(s).split('.').map(function(x){return parseInt(x,10)||0;});}
    var ka=k(a.stt),kb=k(b.stt),n=Math.max(ka.length,kb.length);
    for(var i=0;i<n;i++){var d=(ka[i]||0)-(kb[i]||0); if(d) return d;} return 0;
  }).map(function(c){
    var lvl=String(c.stt).split('.').length, val=costBy[c.stt]||0;
    var cls = lvl===1?'lv1':(lvl===2?'lv2':'lv3');
    return '<tr class="'+cls+'"><td class="ct">'+esc2(c.stt)+'</td><td>'+esc2(c.hangMuc||'')
      +(c.moTa?'<div class="mo">'+esc2(c.moTa)+'</div>':'')+'</td><td class="rt">'+money(val)
      +'</td><td class="rt">'+(total>0?((val/total*100).toFixed(1)+'%'):'')+'</td></tr>';
  }).join('');
  // Chi tiết theo Nhóm -> Tầng
  var cats={}, order=[];
  (q.lines||[]).forEach(function(l){ var k=(l.nhom||'Khác').trim()||'Khác'; if(!cats[k]){cats[k]={items:[]};order.push(k);} cats[k].items.push(l); });
  var detail = order.map(function(nm){
    var items=cats[nm].items, byTang={}, tOrder=[], tot=0;
    items.forEach(function(l){ var t=(l.tang||'').trim()||'CHƯA PHÂN TẦNG'; if(!byTang[t]){byTang[t]=[];tOrder.push(t);} byTang[t].push(l); tot+=Number(l.thanhTienBan)||0; });
    var head='<tr>'+cols.map(function(c){return '<th class="'+(c.num?'rt':'')+'">'+esc2(c.label)+'</th>';}).join('')+'</tr>';
    var body=tOrder.map(function(t){
      var sub=byTang[t].reduce(function(s,l){return s+(Number(l.thanhTienBan)||0);},0);
      var gr='<tr class="grp"><td colspan="'+cols.length+'">'+esc2(t)+' — '+money(sub)+'</td></tr>';
      var rows=byTang[t].map(function(l,idx){
        return '<tr>'+cols.map(function(c){
          var v;
          if(c.key==='stt') v=idx+1;
          else if(c.key==='thanhTienBan') v=money(l.thanhTienBan);
          else if(c.key==='donGiaBan') v=money(l.donGiaBan);
          else if(c.key==='soLuong') v=l.soLuong;
          else if(c.key==='hinhAnh') return '<td class="ct">'+(l.hinhAnh?'<img src="'+esc2(l.hinhAnh)+'">':'')+'</td>';
          else v=l[c.key]!=null?l[c.key]:(l[({loai:'loai',khuVuc:'khuVuc'})[c.key]]||'');
          return '<td class="'+(c.num?'rt':'')+'">'+esc2(v)+'</td>';
        }).join('')+'</tr>';
      }).join('');
      return gr+rows;
    }).join('');
    return '<h3>'+esc2(nm)+'</h3><table class="dt"><thead>'+head+'</thead><tbody>'+body
      +'<tr class="tot"><td colspan="'+(cols.length-1)+'" class="rt">TỔNG '+esc2(nm)+'</td><td class="rt">'+money(tot)+'</td></tr>'
      +'</tbody></table>';
  }).join('');

  var html = '<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Báo giá '+esc2(p.ten||maDA)+'</title>'
    +'<style>'
    +'*{box-sizing:border-box} body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:18px;font-size:12px}'
    +'h1{background:#12314f;color:#fff;text-align:center;padding:10px;margin:0;font-size:18px}'
    +'h2{text-align:center;color:#1f3864;margin:6px 0 2px} h3{background:#1f3864;color:#fff;padding:6px 8px;margin:18px 0 0;font-size:14px}'
    +'.sub{text-align:center;color:#666;margin:0 0 8px} table{width:100%;border-collapse:collapse;margin-top:4px}'
    +'th,td{border:1px solid #b8c4d4;padding:4px 6px;vertical-align:middle} th{background:#1f3864;color:#fff}'
    +'.rt{text-align:right} .ct{text-align:center} .mo{color:#666;font-style:italic;font-size:11px}'
    +'.lv1 td{background:#c9ccd1;font-weight:bold} .lv2 td{background:#eef0f2;font-weight:bold}'
    +'.grp td{background:#dbe9f6;color:#1f3864;font-weight:bold} .tot td{background:#f4e9d8;font-weight:bold}'
    +'.dt img{max-height:44px;max-width:64px;object-fit:contain} .info{width:100%;margin:8px 0}'
    +'.info td{border:none;padding:2px 4px} @media print{ body{margin:8mm} h3{page-break-after:avoid} table{page-break-inside:auto} tr{page-break-inside:avoid} }'
    +'</style></head><body>'
    +'<h1>BẢNG ƯỚC TÍNH CHI PHÍ DỰ ÁN</h1>'
    +'<div class="sub">Mã báo giá số : '+esc2(p.maBaoGia||'')+'</div>'
    +'<table class="info"><tr><td><b>Khách hàng:</b> '+esc2(p.khachHang||'')+'</td><td><b>Quy mô:</b> '+esc2(p.quyMo||'')+'</td></tr>'
    +'<tr><td><b>Tổng DT XD (m²):</b> '+esc2(p.tongDT||'')+'</td><td><b>Nhu cầu:</b> '+esc2(p.nhuCau||'')+'</td></tr>'
    +'<tr><td><b>DT báo giá (m²):</b> '+esc2(p.dtBaoGia||'')+'</td><td><b>Phân khúc:</b> '+esc2(p.phanKhuc||'')+'</td></tr></table>'
    +'<table><thead><tr><th class="ct">NO</th><th>HẠNG MỤC</th><th class="rt">CHI PHÍ DỰ KIẾN</th><th class="rt">TỶ TRỌNG</th></tr></thead>'
    +'<tbody>'+coverRows+'<tr class="lv1"><td colspan="2">TỔNG CHI PHÍ DỰ KIẾN (VNĐ)</td><td class="rt">'+money(total)+'</td><td></td></tr></tbody></table>'
    +detail
    +'</body></html>';

  var w = window.open('', '_blank');
  if(!w){ toast('Trình duyệt chặn cửa sổ in — hãy cho phép popup'); return; }
  w.document.open(); w.document.write(html); w.document.close();
  // đợi ảnh tải rồi in
  setTimeout(function(){ try{ w.focus(); w.print(); }catch(e){} }, 600);
}
function downloadBlob(res){
  var bin=atob(res.base64), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  var blob=new Blob([bytes],{type:res.mimeType});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=res.name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1500);
}
function renderQuoteTable(){
  var q=S.quote, el=document.getElementById('quoteCard');
  if(!q.lines.length){ el.innerHTML='<div class="empty">Chưa có hạng mục.</div>'; return; }
  var cols=QCOLS.filter(function(c){return S.cols[c.key];}), ncol=cols.length;
  var head=cols.map(function(c){return '<th class="'+(c.num?'num':'')+'">'+c.label+'</th>';}).join('');
  // gom theo Tầng (I — TẦNG…) đúng thứ tự như phần Bóc tách
  var groups=[],gmap={};
  q.lines.forEach(function(l){ var k=(l.tang||'').trim()||'CHƯA PHÂN TẦNG'; if(!gmap[k]){gmap[k]={name:k,items:[]};groups.push(gmap[k]);} gmap[k].items.push(l); });
  var ord=myTangs(), gpos={};
  groups.forEach(function(g,i){ var k=ord.indexOf(g.name); gpos[g.name]=(g.name==='CHƯA PHÂN TẦNG')?1e9:(k>=0?k:1000+i); });
  groups.sort(function(a,b){ return gpos[a.name]-gpos[b.name]; });
  var cellFor=function(c,l,idx){
    if(c.key==='stt') return '<td class="num">'+(idx+1)+'</td>';
    if(c.key==='thanhTienBan') return '<td class="num"><b>'+fmt(l.thanhTienBan)+'</b></td>';
    if(c.key==='donGiaBan') return '<td class="num">'+fmt(l.donGiaBan)+'</td>';
    if(c.key==='soLuong') return '<td class="num">'+fmt(l.soLuong)+'</td>';
    if(c.key==='hinhAnh'){ return '<td>'+imgTag(lineImg(l))+'</td>'; }
    return '<td class="'+(c.num?'num':'')+'">'+esc(l[c.key])+'</td>';
  };
  var body=groups.map(function(g,gi){
    var hd='<tr class="qgrp"><td colspan="'+ncol+'">'+roman(gi+1)+' — '+esc(g.name)+' <span style="opacity:.6;font-weight:700">('+g.items.length+' mục)</span></td></tr>';
    return hd+g.items.map(function(l,idx){
      return '<tr>'+cols.map(function(c){ return cellFor(c,l,idx); }).join('')+'</tr>';
    }).join('');
  }).join('');
  el.innerHTML='<div style="display:flex;align-items:center;margin-bottom:12px"><h3 style="margin:0">Báo giá — '+esc(q.project?q.project.ten:'')+'</h3></div>'
    +'<div class="tbl-wrap"><table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'
    +'<div class="totbar">'
      +'<div class="t"><div class="k">Tạm tính</div><div class="v">'+fmt(q.subtotal)+' đ</div></div>'
      +'<div class="t"><div class="k">VAT '+q.vatPct+'%</div><div class="v">'+fmt(q.vat)+' đ</div></div>'
      +'<div class="t grand"><div class="k">Tổng cộng</div><div class="v">'+fmt(q.total)+' đ</div></div>'
    +'</div>';
}
