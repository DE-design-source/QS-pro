# Render Blueprint — deploy QS Pro (Node web service).
# Cách dùng: Render Dashboard -> New -> Blueprint -> chọn repo QS-pro.
# 2 biến bí mật (sync:false) sẽ nhập trên Dashboard, KHÔNG nằm trong code.
services:
  - type: web
    name: qs-pro
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: LARK_DOMAIN
        value: https://open.larksuite.com
      # Supabase (nguồn dữ liệu chính). Publishable key — Supabase ghi rõ an toàn công khai.
      - key: SUPABASE_URL
        value: https://xcjnpjpkmwhekkabpjzw.supabase.co
      - key: SUPABASE_BUCKET
        value: products
      - key: SUPABASE_KEY
        value: sb_publishable_Am7BKsK-MM3at1Gv34iY0g_bHJopSsV
      # Webhook Lark riêng cho báo cáo nhập SP (để tin không bị dính tên bot
      # "Yêu cầu mua hàng"). Bỏ trống -> dùng chung webhook yêu cầu mua hàng.
      - key: REPORT_WEBHOOK
        sync: false
      # Lark: chỉ còn dùng tải ảnh cũ (/media). Nhập trên Dashboard, không commit:
      - key: LARK_APP_ID
        sync: false
      - key: LARK_APP_SECRET
        sync: false
