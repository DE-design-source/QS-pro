# Render Blueprint — deploy QS Pro (Node web service).
# Cách dùng: Render Dashboard -> New -> Blueprint -> chọn repo QS-pro.
# 2 biến bí mật (sync:false) sẽ nhập trên Dashboard, KHÔNG nằm trong code.
services:
  - type: web
    name: qs-pro
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && node scripts/build-info.js
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: LARK_DOMAIN
        value: https://open.larksuite.com
      - key: LARK_APP_TOKEN
        value: GpCXbwtuvaOB0BsavQrlgS5ggXc
      - key: LARK_TBL_PRODUCTS
        value: tbloW9NkLk9lwV5V
      - key: LARK_TBL_PROJECTS
        value: tbl1JUceYBQ2gZ9Y
      - key: LARK_TBL_LINES
        value: tblI9uBLvTy4GcYx
      - key: LARK_TBL_COVER
        value: tblutEmDYQMZv9ni
      # Webhook bot Lark — gửi noti mỗi khi deploy xong
      - key: LARK_BUILD_WEBHOOK
        value: https://open.larksuite.com/open-apis/bot/v2/hook/da87d0e4-648f-4106-83a0-21c87f7eb136
      # Nhập 2 giá trị dưới trên Dashboard (Environment) — bí mật, không commit:
      - key: LARK_APP_ID
        sync: false
      - key: LARK_APP_SECRET
        sync: false
